[package]
name = "chess-eye-rs"
version = "0.1.0"
edition = "2021"
description = "ChessEye Rust — Lichess Board SSE + Stockfish + Human Mode + Dual Display"
authors = ["whp233"]
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shakmaty = "0.27"
rand = "0.8"
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"

# GUI — M2 才启用，M0 先注释避免 CI 太重
# eframe = { version = "0.28", optional = true }
# egui = { version = "0.28", optional = true }

[dev-dependencies]
# mirror 61 python tests
approx = "0.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
