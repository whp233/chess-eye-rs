[package]
name = "chess-eye-rs"
version = "0.1.1"
edition = "2021"
description = "ChessEye Rust — Lichess Board SSE + Stockfish + Human Mode + Dual Display"
authors = ["whp233"]
license = "MIT"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shakmaty = "0.27"
rand = "0.8"
anyhow = "1.0"
thiserror = "1.0"
chrono = "0.4"
eframe = "0.27"
egui = "0.27"

[dev-dependencies]
# mirror 61 python tests
approx = "0.5"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
