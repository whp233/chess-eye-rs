name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --verbose
      - name: Prepare dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item target/release/chess-eye-rs.exe dist/ -Force
          Copy-Item config.json.example dist/config.json -Force
          Copy-Item "双击运行.bat" dist/ -Force
          Copy-Item README.md dist/ -Force
          Copy-Item CLAUDE.md dist/ -Force
          # book.bin / stockfish.exe 109M 超 GitHub 100M 限制，不进 git，打包时若 runner 有则带上
          if (Test-Path book.bin) { Copy-Item book.bin dist/ -Force }
          if (Test-Path stockfish.exe) { Copy-Item stockfish.exe dist/ -Force }
          Get-ChildItem dist | Format-Table Name, Length
      - name: Zip
        shell: pwsh
        run: |
          $ver = (Select-String 'version = "(.*)"' Cargo.toml).Matches[0].Groups[1].Value
          Compress-Archive -Path dist/* -DestinationPath "chess-eye-rs-v$ver-windows.zip" -Force
          Get-Item "chess-eye-rs-v$ver-windows.zip" | Format-List FullName, Length
      - name: Upload artifact (zip)
        uses: actions/upload-artifact@v4
        with:
          name: chess-eye-rs-release-zip
          path: chess-eye-rs-*.zip
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: chess-eye-rs-*.zip
          generate_release_notes: true
